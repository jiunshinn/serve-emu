name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Complete package check
            command: bun run --filter serve-emul check
          - name: Unit tests
            command: bun run --filter serve-emul test
          - name: Critical coverage
            command: bun run --filter serve-emul coverage
          - name: Server typecheck
            command: bun run --filter serve-emul typecheck
          - name: UI typecheck
            command: bun run --filter serve-emul typecheck:ui
          - name: Test and script typecheck
            command: bun run --filter serve-emul typecheck:tests
          - name: Production build
            command: bun run --filter serve-emul build
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Bun 1.3.13
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  browser:
    name: Browser streaming integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Bun 1.3.13
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: packages/serve-emul
        run: bunx playwright install --with-deps chromium
      - name: Test built UI and production WebSocket pipeline
        run: bun run --filter serve-emul test:browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failure-evidence
          path: packages/serve-emul/test-results/
          retention-days: 7
