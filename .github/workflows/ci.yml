name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Package check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One step per command of the `check` script in packages/serve-emu/
    # package.json, in the same order (tests/ci-workflow.test.ts enforces
    # this). Each step runs even if an earlier one failed, so every failure in
    # a push is reported once, by name.
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Bun 1.3.13
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13

      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: README in sync
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --filter serve-emu docs:check

      - name: Production-only unused files
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --filter serve-emu check:unused:prod

      - name: Unused exports and dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --filter serve-emu check:unused

      - name: Unit tests and critical coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --filter serve-emu coverage

      - name: Server typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --filter serve-emu typecheck

      - name: UI typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --filter serve-emu typecheck:ui

      - name: Test and script typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --filter serve-emu typecheck:tests

      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --filter serve-emu build

      - name: Package smoke test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --filter serve-emu test:package

  browser:
    name: Browser streaming integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Bun 1.3.13
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: packages/serve-emu
        run: bunx playwright install --with-deps chromium
      - name: Test built UI and production WebSocket pipeline
        run: bun run --filter serve-emu test:browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failure-evidence
          path: packages/serve-emu/test-results/
          retention-days: 7
