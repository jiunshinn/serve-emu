<!doctype html>
<!--
  Load page for FPS measurements. Open it in Chrome on the emulator: it scrolls
  a long list by 12 px every animation frame, so the screen changes at the
  display rate, and the corner HUD shows the page's own requestAnimationFrame
  rate. That makes it possible to tell whether a low stream rate starts in the
  guest's rendering or later in the capture/encode pipeline.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>serve-emu scroll load</title>
<style>
  body { margin: 0; font: 16px/1.4 sans-serif; background: #fafafa; }
  .card { margin: 10px; padding: 14px; border-radius: 12px; color: #111; display: flex; gap: 12px; }
  .dot { width: 48px; height: 48px; border-radius: 50%; flex: none; }
  #hud { position: fixed; top: 8px; right: 8px; background: #000c; color: #fff; padding: 4px 8px; font: 14px monospace; z-index: 9; }
</style>
</head>
<body>
<div id="hud">fps</div>
<div id="list"></div>
<script>
  const list = document.getElementById("list");
  const words = "lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua".split(" ");
  let html = "";
  for (let i = 0; i < 400; i++) {
    const h = (i * 37) % 360;
    let text = "";
    for (let j = 0; j < 30; j++) text += words[(i * 7 + j * 3) % words.length] + " ";
    html += `<div class="card" style="background:hsl(${h} 70% 88%)"><div class="dot" style="background:hsl(${(h + 180) % 360} 60% 50%)"></div><div><b>Item ${i}</b><br>${text}</div></div>`;
  }
  list.innerHTML = html;

  const hud = document.getElementById("hud");
  let direction = 1;
  let frames = 0;
  let last = performance.now();
  function tick(now) {
    window.scrollBy(0, 12 * direction);
    const max = document.documentElement.scrollHeight - innerHeight;
    if (scrollY >= max - 1) direction = -1;
    else if (scrollY <= 0) direction = 1;
    frames++;
    if (now - last >= 1000) {
      hud.textContent = `${frames} fps`;
      frames = 0;
      last = now;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
